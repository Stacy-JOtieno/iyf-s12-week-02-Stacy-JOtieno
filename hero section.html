<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HERO SECTION</title>
    <style>

/* ===== DAY 3: HERO SECTION ===== */

.hero-section {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;

    background-image:
        linear-gradient(rgba(11, 30, 57, 0.7),
        rgba(11, 30, 57, 0.7)),
        url("me.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.hero-content {
    color: white;
    max-width: 800px;
}

.hero-content h1 {
    font-size: clamp(2rem, 5vw, 4rem);
    margin-bottom: 20px;
}

.hero-content p {
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    margin-bottom: 30px;
}

    </style>
</head>
<body>
    
<section class="hero-section">
    <div class="hero-content">
        <h1>Welcome to My World</h1>
        <p>Engineering. Creativity. Innovation.</p>
        <a href="projects.html" class="btn btn-primary">Explore My Work</a>
    </div>
</section>

</body>
</html>
